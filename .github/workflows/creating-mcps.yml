name: Creating MCPs

# The Creating MCPs course needs Python 3.13+ and its own dependencies (MCP SDK v2, marimo,
# psycopg, opensearch-py), so it has its own workflow instead of joining the 3.9 matrix in
# ci.yml. Two jobs:
#   * static      -- lint, compile, marimo notebook checks, lesson snippets. No network
#                    services, no secrets.
#   * integration -- bring up the estate (Postgres + OpenSearch), seed the small data set and
#                    run the course preflight against it, the same way a learner does.
# Neither job calls the model endpoint, so no API key is needed.

on:
  push:
    branches: [main]
    paths:
      - "creating-mcps/**"
      - "examples/18/**"
      - "scripts/check_lessons.py"
      - ".github/workflows/creating-mcps.yml"
  pull_request:
    paths:
      - "creating-mcps/**"
      - "examples/18/**"
      - "scripts/check_lessons.py"
      - ".github/workflows/creating-mcps.yml"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the course
        run: |
          python -m pip install --upgrade pip
          pip install -e "creating-mcps[dev]"

      - name: Lint (Pyflakes rules)
        run: ruff check --select F creating-mcps

      - name: Compile every source
        run: python -m py_compile creating-mcps/examples/*.py creating-mcps/examples/*/*.py creating-mcps/env/*.py creating-mcps/env/seed/*.py creating-mcps/labs/*.py

      - name: marimo notebooks are well-formed
        run: marimo check --strict creating-mcps/labs/*.py

      - name: Lesson snippets are self-contained
        run: python scripts/check_lessons.py "creating-mcps/lessons/*.md"

      - name: Unit 1 server and client (in-memory fixture, no estate needed)
        run: python creating-mcps/examples/01/client.py --tap "$RUNNER_TEMP/frames.jsonl"

      - name: Unit 1 lab runs end to end
        run: marimo export html creating-mcps/labs/01_protocol_inspector.py -o "$RUNNER_TEMP/01_protocol_inspector.html"

      - name: Unit 2 host starts both servers and builds its tool table
        run: python creating-mcps/examples/02/host.py --list

      - name: Unit 2 lab runs end to end (manual mode, no model)
        run: marimo export html creating-mcps/labs/02_chat_host.py -o "$RUNNER_TEMP/02_chat_host.html"

      - name: Unit 4 time windows parse, refuse and pick daily indexes
        run: |
          python - <<'PY'
          import sys
          from datetime import UTC, datetime, timedelta
          sys.path.insert(0, "creating-mcps/examples/04")
          import windows as W

          now = datetime(2026, 10, 11, 12, 0, tzinfo=UTC)
          w = W.window("2026-10-09T04:00", "2026-10-09T05:00", tz="Europe/Paris",
                       max_span=timedelta(hours=24), now=now)
          assert W.iso(w.start) == "2026-10-09T02:00:00Z", w.describe()
          assert W.daily_indexes("logs-auth", w) == ["logs-auth-2026.10.09"]
          assert W.daily_indexes("logs-auth", W.window("now-25h", now=now, max_span=W.RETENTION)) \
              == ["logs-auth-2026.10.10", "logs-auth-2026.10.11"]
          for args, needle in [(("now-3d",), "at most 24h"), (("now", "now-1d"), "swap"),
                               (("now-30d",), "retention"), (("yesterday",), "ISO 8601")]:
              try:
                  W.window(*args, max_span=timedelta(hours=24), now=now, tool="search_events")
              except W.WindowError as e:
                  assert needle in str(e), (args, str(e))
              else:
                  raise AssertionError(f"{args} should be refused")
          print("windows: parsing, refusals and index selection OK")
          PY

      - name: Unit 7 policy decides its table of cases
        run: python creating-mcps/examples/07/policy.py --test

      - name: Unit 8 limits refuse in order and say when to retry
        run: |
          python - <<'PY'
          import asyncio, sys
          sys.path.insert(0, "creating-mcps/examples/08")
          import limits as L

          now = [0.0]
          b = L.TokenBucket(3, 1, clock=lambda: now[0])
          assert [b.take() for _ in range(4)] == [0, 0, 0, 1.0]
          now[0] = 2.0
          assert b.take() == 0

          def refused(kind, gen):
              try:
                  gen()
              except L.Busy as e:
                  assert e.kind == kind, (kind, e.kind)
                  assert "Retry the same call after" in str(e), str(e)
                  return
              raise AssertionError(f"{kind} should refuse")

          async def admit(lim, who):
              async with lim.admit(who):
                  pass

          async def main():
              lim = L.Limiter(L.Settings(rate=0.01, burst=2, per_caller=1, total=1,
                                         queue_wait=0.05, cursors=1, cursors_total=1))
              async with lim.admit("a"):
                  for who, kind in (("a", "concurrency"), ("b", "capacity")):
                      try:
                          await admit(lim, who)
                      except L.Busy as e:
                          assert e.kind == kind, (who, e.kind)
                      else:
                          raise AssertionError(f"{kind} should refuse")
              try:
                  await admit(lim, "a")                   # its burst of 2 is spent
              except L.Busy as e:
                  assert e.kind == "rate", e.kind
              else:
                  raise AssertionError("rate should refuse")
              lim.charge("b", 10**9)                      # a result far over the quota
              try:
                  await admit(lim, "b")
              except L.Busy as e:
                  assert e.kind == "quota", e.kind
              else:
                  raise AssertionError("quota should refuse")
              lim.may_open_cursor("c")
              lim.opened_cursor("c")
              refused("cursors", lambda: lim.may_open_cursor("c"))
              refused("cursors_total", lambda: lim.may_open_cursor("d"))

          asyncio.run(main())
          print("limits: token bucket, rate, quota, concurrency, capacity and cursors OK")
          PY

  integration:
    runs-on: ubuntu-latest
    needs: static
    defaults:
      run:
        working-directory: creating-mcps
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the course
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Configure the estate
        # The example passwords are throwaway values for a disposable CI estate.
        run: cp env/.env.example env/.env

      - name: Start Postgres and OpenSearch
        run: python env/env.py up

      - name: Seed the small data set
        run: python env/env.py seed --size small

      - name: Preflight (the same check learners run)
        run: python env/env.py check --no-llm

      - name: Unit 0 reference solution
        run: python examples/00/estate_tour.py

      - name: Unit 0 lab runs end to end
        run: marimo export html labs/00_raw_frames.py -o "$RUNNER_TEMP/00_raw_frames.html"

      - name: Unit 3 catalog agrees with what the estate enforces
        run: python examples/03/catalog.py --check

      - name: Unit 3 profiler and discovery cost (raw vs curated)
        run: |
          python examples/03/profile.py "logs-auth-*"
          python examples/03/measure.py --persona l1_analyst
          python examples/03/measure.py --persona l3_responder

      - name: Unit 3 CMDB server on Postgres follows row-level security
        run: |
          python - <<'PY'
          import asyncio, os, sys
          from mcp import Client, StdioServerParameters

          async def lookup(persona, host):
              server = StdioServerParameters(command=sys.executable,
                                             args=["examples/03/cmdb_server.py"],
                                             env={"MCP_PERSONA": persona})
              async with Client(server) as client:
                  return await client.call_tool("get_asset", {"hostname": host})

          l1 = asyncio.run(lookup("l1_analyst", "db-prod-01"))
          l3 = asyncio.run(lookup("l3_responder", "db-prod-01"))
          assert l1.is_error, "L1 must not see a restricted host"
          assert not l3.is_error and l3.structured_content["classification"] == "restricted"
          print("db-prod-01: hidden from l1_analyst, visible to l3_responder")
          PY

      - name: Unit 3 eval skips cleanly without a model
        run: python examples/03/eval_discovery.py

      - name: Unit 3 lab runs end to end
        run: marimo export html labs/03_catalogs.py -o "$RUNNER_TEMP/03_catalogs.html"

      - name: Unit 4 SIEM server bounds, shapes and pages, per persona
        run: |
          python - <<'PY'
          import asyncio, sys
          from mcp import Client, StdioServerParameters

          async def session(persona, calls):
              server = StdioServerParameters(command=sys.executable,
                                             args=["examples/04/siem_server.py"],
                                             env={"MCP_PERSONA": persona})
              async with Client(server) as client:
                  return await calls(client)

          def text(r):
              return r.content[0].text if r.content else ""

          async def l1(c):
              inc = (await c.call_tool("get_incident", {"incident_id": "INC-0042"})).structured_content
              win = inc["suggested_window"]
              fail = {"event.outcome": "failure"}
              hist = (await c.call_tool("event_histogram", {"dataset": "auth", **win,
                                                            "filters": fail})).structured_content
              assert hist["peak"]["count"] >= 250 and hist["total"] >= 1500, hist["peak"]
              top = (await c.call_tool("top_values", {"dataset": "auth", "field": "source.ip",
                                                      **win, "filters": fail})).structured_content
              assert top["values"][0] == {"value": "203.0.113.77", "count": 1500}, top["values"][0]
              args = {"dataset": "auth", **win, "filters": {"source.ip": "203.0.113.77"},
                      "limit": 5}
              p1 = (await c.call_tool("search_events", args)).structured_content
              assert p1["total"] == 1501 and p1["total_exact"] and "hint" in p1
              p2 = (await c.call_tool("search_events", {**args, "cursor": p1["next_cursor"]})).structured_content
              assert p2["page"] == 2 and p2["events"][0]["@timestamp"] >= p1["events"][-1]["@timestamp"]
              assert p2["events"] != p1["events"]
              refusals = {
                  "different search": ("search_events", {**args, "filters": {}, "cursor": p1["next_cursor"]}),
                  "isn't one this server issued": ("search_events", {**args, "cursor": p1["next_cursor"][:-4] + "beef"}),
                  "at most 24h": ("search_events", {"dataset": "auth", "start": "now-3d"}),
                  "aren't available to your role": ("search_events", {"dataset": "edr", **win}),
                  "isn't a web field you can use": ("search_events", {"dataset": "web", **win,
                                                                      "filters": {"user.email": "x"}}),
              }
              for needle, (tool, a) in refusals.items():
                  r = await c.call_tool(tool, a)
                  assert r.is_error and needle in text(r), (needle, text(r))
              print("l1_analyst: incident, histogram, top values, paging and refusals OK")

          async def l3(c):
              edr = (await c.call_tool("search_events", {
                  "dataset": "edr", "start": "now-21d", "end": "now-20d"})).structured_content
              assert "total" in edr
              r = await c.call_tool("search_events", {"dataset": "web", "start": "now-2d",
                                                      "end": "now-1d", "filters": {"user.email": "x"}})
              assert r.is_error and "masked" in text(r), text(r)
              t = (await c.call_tool("top_values", {"dataset": "web", "field": "user.email",
                                                    "start": "now-3d"})).structured_content
              assert len(t["values"][0]["value"]) == 64            # a stable hash, not an address
              print("l3_responder: EDR readable, masked field countable but not filterable")

          asyncio.run(session("l1_analyst", l1))
          asyncio.run(session("l3_responder", l3))
          PY

      - name: Unit 4 cost comparison and the investigation path
        run: |
          python examples/04/cost.py
          python examples/04/investigate.py
          python examples/04/investigate.py --persona l3_responder --model

      - name: Unit 4 lab runs end to end
        run: marimo export html labs/04_searching_logs.py -o "$RUNNER_TEMP/04_searching_logs.html"

      - name: Unit 5 OpenSearch's own MCP server, in its own environment
        run: |
          python -m venv .venv-osmcp
          .venv-osmcp/bin/pip install --quiet opensearch-mcp-server-py==0.12.0

      - name: Unit 5 SQL guard accepts reads and refuses the rest
        run: |
          python - <<'PY'
          import sys
          sys.path[:0] = ["examples/05", "examples"]
          import sql_guard
          from common_mcp import pg_connect

          ok = ["SELECT hostname FROM cmdb.assets LIMIT 3",
                "WITH p AS (SELECT * FROM cmdb.assets WHERE environment = 'prod') "
                "SELECT os, count(*) FROM p GROUP BY os",
                "SELECT s.name FROM cmdb.services s WHERE s.tier = 1 UNION "
                "SELECT name FROM cmdb.teams"]
          refused = {
              "SET statement_timeout = 0; SELECT pg_sleep(6)": "exactly one statement",
              "WITH x AS (DELETE FROM cmdb.assets RETURNING *) SELECT * FROM x": "DELETE",
              "SELECT pg_sleep(30)": "pg_sleep",
              "SELECT pg_read_file('/etc/passwd')": "pg_read_file",
              "SELECT * FROM generate_series(1, 1000000000)": "generate_series",
              "SELECT rolname FROM pg_catalog.pg_roles": "pg_catalog",
              "SELECT hostname FROM assets": "qualify",
              "SELECT * FROM cmdb.assets FOR UPDATE": "lock",
              "UPDATE cmdb.assets SET os = 'x'": "only SELECT",
              "CREATE TEMP TABLE t AS SELECT 1": "only SELECT",
          }
          for q in ok:
              sql_guard.check(q)
          for q, needle in refused.items():
              try:
                  sql_guard.check(q)
              except sql_guard.SqlRefused as e:
                  assert needle.lower() in str(e).lower(), (q, str(e))
              else:
                  raise AssertionError(f"not refused: {q}")
          with pg_connect("l1_analyst") as conn:
              r = sql_guard.run(conn, "SELECT a.hostname FROM cmdb.assets a, cmdb.teams t")
          assert r["returned"] == sql_guard.MAX_ROWS and r["truncated"], r["returned"]
          print(f"{len(ok)} reads accepted, {len(refused)} refused, row cap holds")
          PY

      - name: Unit 5 PPL guard bounds by construction and checks the plan
        run: |
          python - <<'PY'
          import sys
          sys.path[:0] = ["examples/05", "examples"]
          import ppl_guard
          from common_mcp import os_client

          c = os_client("l1_analyst")
          q = ("source = logs-auth-* | where `event.outcome` = 'failure' "
               "| stats count() as n by `source.ip` | sort - n | head 1")
          r = ppl_guard.run(c, q, "l1_analyst", "now-8d", "now-1d")
          assert "@timestamp" in r["ran"] and "head 200" in r["ran"], r["ran"]
          assert "logs-auth-*" not in r["ran"], r["ran"]
          incidents = ppl_guard.run(c, "source = incidents | stats count()", "l1_analyst")
          assert incidents["rows"][0][0] > 0
          refused = {
              "source = edr-events-* | stats count()": "isn't an index pattern",
              "source = logs-auth-* | join x": "isn't allowed",
              "source = logs-auth-* | where like(message, '%svc_backup%')": "leading wildcards",
          }
          for query, needle in refused.items():
              try:
                  ppl_guard.run(c, query, "l1_analyst", "now-2d", "now-1d")
              except ppl_guard.PplRefused as e:
                  assert needle in str(e), (query, str(e))
              else:
                  raise AssertionError(f"not refused: {query}")
          for window, needle in {(None, None): "need a window",
                                 ("now-10d", "now"): "at most"}.items():
              try:
                  ppl_guard.run(c, "source = logs-auth-* | stats count()", "l1_analyst", *window)
              except ppl_guard.PplRefused as e:
                  assert needle in str(e), (window, str(e))
              else:
                  raise AssertionError(f"window not refused: {window}")
          print("PPL: bounded, capped, and refusals OK")
          PY

      - name: Unit 5 blast radius, every variant
        run: |
          python - <<'PY'
          import asyncio, sys
          sys.path[:0] = ["examples/05", "examples"]
          import blast, variants
          from common_mcp import load_env

          load_env()
          assert "permissive" in variants.available(), "osmcp not found"
          rows = {r["probe"]: r for r in asyncio.run(blast.run("l1_analyst"))}
          for r in rows.values():
              print(f"{r['probe']:<18} " + "  ".join(f"{v}={r[v]}" for v in variants.NAMES))
          ran = lambda v: {p for p, r in rows.items() if r[v].startswith("ran")}
          assert {"system-catalogs", "lift-timeout", "temp-table", "cluster-internals",
                  "script"} <= ran("permissive"), ran("permissive")
          assert not ran("guarded") and not ran("restrictive") and not ran("hybrid")
          for p in ("update", "pii", "close-incident"):
              assert rows[p]["permissive"] == "stopped by the backend", rows[p]
          PY

      - name: Unit 5 grid prints tool-list costs and skips cleanly without a model
        run: python examples/05/grid.py

      - name: Unit 5 lab runs end to end
        run: marimo export html labs/05_permission_dial.py -o "$RUNNER_TEMP/05_permission_dial.html"

      - name: Unit 6 tool-list cost, lint and error audit across styles
        run: |
          python - <<'PY'
          import asyncio, sys
          sys.path[:0] = ["examples/06", "examples/05", "examples"]
          import errors, lint, styles, toolcost, variants
          from common_mcp import load_env

          load_env()
          cost = {s: toolcost.total(asyncio.run(toolcost.measure(s, "l1_analyst")))
                  for s in styles.STYLES}
          for s, t in cost.items():
              print(f"{s:<10} {t['sent']:>6} bytes  ~{t['tokens']} tokens  titles {t['titles']}")
          sent = {s: t["sent"] for s, t in cost.items()}
          assert sent["terse"] < sent["original"] < sent["lean"] < sent["rewritten"], sent
          assert all(t["titles"] > 0 for t in cost.values())

          found = {s: lint.summary(asyncio.run(lint.lint(styles.server_table(s, "l1_analyst"))))
                   for s in styles.STYLES}
          found["permissive"] = lint.summary(asyncio.run(lint.lint(
              variants.servers("permissive", "l1_analyst"))))
          print(found)
          assert found["rewritten"] == {"errors": 0, "warnings": 0}, found["rewritten"]
          assert found["lean"] == {"errors": 0, "warnings": 0}, found["lean"]
          assert found["terse"].get("D1") == 10 and found["original"]["errors"] == 0
          assert found["permissive"].get("N1", 0) >= 9

          def mean(rows):
              graded = [r for r in rows if r["score"] is not None]
              return sum(r["score"] for r in graded) / len(graded), graded

          good, graded = mean(asyncio.run(errors.audit("original", "l1_analyst")))
          bad, _ = mean(asyncio.run(errors.audit("original", "l1_analyst", "generic")))
          lean, lean_rows = mean(asyncio.run(errors.audit("lean", "l1_analyst")))
          print(f"error audit: original {good:.2f}, generic {bad:.2f}, lean {lean:.2f}")
          assert len(graded) == len(errors.MISTAKES), "every mistake must be refused"
          assert not any(r["dangling"] or r["leaks"] for r in graded + lean_rows)
          assert good >= 2.0 and bad < good and lean >= good - 0.01
          PY

      - name: Unit 6 golden set matches every style; evals skip cleanly without a model
        run: |
          python examples/06/selection.py
          python examples/06/recovery.py

      - name: Unit 6 lab runs end to end
        run: marimo export html labs/06_tools_for_a_model.py -o "$RUNNER_TEMP/06_tools_for_a_model.html"

      - name: Unit 7 four layers of refusal (tokens, tool lists, backends, policy)
        run: python examples/07/refusals.py

      - name: Unit 7 stdio mode refuses a bad token and serves a good one
        run: |
          python - <<'PY'
          import asyncio, os, subprocess, sys
          sys.path[:0] = ["examples/07", "examples"]
          import issuer
          from mcp import Client, StdioServerParameters

          bad = subprocess.run([sys.executable, "examples/07/gateway_server.py", "--kind",
                                "cmdb", "--stdio"], capture_output=True, text=True,
                               env={**os.environ, "MCP_ACCESS_TOKEN": issuer.issue(
                                   "priya", "urn:creating-mcps:siem")})
          assert bad.returncode != 0 and "InvalidAudienceError" in bad.stderr, bad.stderr

          async def main():
              env = {**os.environ, "MCP_ACCESS_TOKEN": issuer.issue(
                  "priya", "urn:creating-mcps:cmdb")}
              params = StdioServerParameters(command=sys.executable, env=env, args=[
                  "examples/07/gateway_server.py", "--kind", "cmdb", "--stdio"])
              async with Client(params) as c:
                  names = [t.name for t in (await c.list_tools()).tools]
                  assert "get_contact" not in names and "get_asset" in names, names
                  r = await c.call_tool("get_asset", {"hostname": "db-prod-01"})
                  assert r.is_error and "no asset named" in r.content[0].text
          asyncio.run(main())
          print("stdio: wrong audience refused at start; priya's list and RLS hold")
          PY

      - name: Unit 7 lab runs end to end
        run: marimo export html labs/07_identity_and_policy.py -o "$RUNNER_TEMP/07_identity_and_policy.html"

      - name: Unit 8 cost gates price queries before they run; the L1 timeout survives the gateway
        run: |
          python examples/08/cost_gates.py
          python - <<'PY'
          import sys, time
          sys.path[:0] = ["examples/08", "examples"]
          import common_mcp as C
          import cost_gates as G

          C.load_env()
          with C.pg_connect("l3_responder") as conn:
              verdicts = []
              for _label, sql, params in G.EXAMPLES:
                  try:
                      G.pg_gate(conn, sql, params)
                      verdicts.append("ok")
                  except G.TooExpensive:
                      verdicts.append("refused")
          assert verdicts == ["ok", "ok", "refused", "refused"], verdicts
          C.use_pools(pg_size=2)
          with C.acting_for("l1_analyst"):
              t0 = time.monotonic()
              try:
                  with C.pg_connect("l1_analyst") as conn:
                      conn.execute("SELECT pg_sleep(8)")
              except Exception as e:
                  kind = C.backend_refusal(e)
              else:
                  kind = None
          took = time.monotonic() - t0
          assert kind and kind[0] == "too_slow" and took < 7, (kind, took)
          print(f"cost gates: {verdicts}; L1 statement cancelled after {took:.1f} s")
          PY

      - name: Unit 8 load, pooled and limited; a runaway agent is contained
        run: |
          python - <<'PY'
          import asyncio, json, sys
          sys.path[:0] = ["examples/08"]
          import loadgen

          async def main():
              plain = await loadgen.run(callers=12, seconds=6)
              everyone = plain["summary"][0]
              errors = [c["detail"] for c in plain["calls"] if c["outcome"] == "error"]
              assert everyone["ok"] > 100 and not errors, (everyone, errors[:3])
              assert everyone["max_pg_connections"] <= 20, everyone
              runaway = await loadgen.run(callers=6, seconds=6, runaway=8)
              rows = {r["who"]: r for r in runaway["summary"]}
              assert rows["agents"]["refused"] == {}, rows["agents"]
              assert rows["runaway"]["refused"].get("busy:rate", 0) > 0, rows["runaway"]
              print(json.dumps(everyone))
              print(json.dumps(rows["agents"]))
              print(json.dumps(rows["runaway"]))
          asyncio.run(main())
          PY

      - name: Unit 8 lab runs end to end
        run: marimo export html labs/08_operating_envelope.py -o "$RUNNER_TEMP/08_operating_envelope.html"

      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file env/.env -f env/compose.yaml logs --tail 200
