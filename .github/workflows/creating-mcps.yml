      - name: Unit 11 a day at the SOC, observed (every call audited and shipped)
        run: |
          python - <<'PY'
          import asyncio, sys, time
          sys.path[:0] = ["examples/11", "examples"]
          import audit, metrics, traffic
          from common_mcp import os_client
          
          day = asyncio.run(traffic.run(agents=3, seconds=8))
          calls = day["calls"]
          who = {r["who"]: r for r in day["summary"]}
          assert calls and who["sam"].get("ok", 0) == 0 and who["marc"].get("ok") == who["marc"]["calls"], who
          traces = sorted({c["trace_id"] for c in calls})
          rows = [r for t in traces for r in audit.trace(t)]
          assert len(rows) == len(calls), (len(rows), len(calls))
          assert {r["verdict"] for r in rows if r["caller"] == "sam"} == {"deny"}
          query = {"query": {"bool": {"filter": [{"terms": {"trace_id": traces}},
                                                 {"term": {"method": "tools/call"}}]}}}
          for _ in range(20):
              shipped = os_client("auditor").count(index="mcp-telemetry-*", body=query)["count"]
              if shipped == len(calls):
                  break
              time.sleep(0.5)
          assert shipped == len(calls), (shipped, len(calls))
          why = {r["why"] for r in metrics.refusals("now-10m")}
          assert {"policy: not-granted", "policy: restricted-hosts-stay-restricted"} <= why, why
          slo = metrics.slo("now-10m", 0.99, 2000)
          assert slo["allowed_calls"] and slo["failed"] == 0, slo
          print(f"{len(calls)} calls in {len(traces)} traces: {len(rows)} audit rows, {shipped} shipped; "
                f"objective {slo['achieved']:.2%}")
          PY

