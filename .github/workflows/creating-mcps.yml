              run = await loadgen.run(callers=4, seconds=6, runaway=8, script=SCALED,
                                      env={"MCP_WORKERS": "3"})
              rows = {r["who"]: r for r in run["summary"]}
              assert rows["agents"]["refused"] == {}, rows["agents"]
