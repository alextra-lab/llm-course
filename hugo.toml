baseURL = "https://learn.frenchforet.com/"
title = "FrenchForet"

enableRobotsTXT = true
enableGitInfo = true

# Language
contentDir = "content"
defaultContentLanguage = "en"

# Docsy needs these
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "tango"
    lineNos = false
    noClasses = false

[module]
  # Mounts: bring the existing lessons/ folder in as the docs section
  # without moving any files (clone-and-read experience stays intact).
  [[module.imports]]
    path = "github.com/google/docsy"
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"

  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "lessons"
    target = "content/docs"
  # Second course: Agent Memory. Mounted as its own docs section (the lessons render
  # in place; their ../examples links are rewritten to GitHub by the render-link hook).
  [[module.mounts]]
    source = "agent-memory/lessons"
    target = "content/agent-memory"
  # Third course: Context Compression. Same pattern — its own docs section, with
  # ../examples links rewritten to GitHub by the render-link hook.
  [[module.mounts]]
    source = "context-compression/lessons"
    target = "content/context-compression"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

[params]
  copyright = "FrenchForet"
  github_repo = "https://github.com/alextra-lab/llm-course"
  github_branch = "main"

  [params.ui]
    breadcrumb_disable = false
    sidebar_menu_compact = false
    sidebar_search_disable = false
    navbar_logo = false

  # Pin Mermaid to the version Docsy v0.15.0 is built against (its own docs use this).
  # Docsy otherwise loads mermaid@latest in the browser at view time, and a newer Mermaid
  # release broke its init code (`mermaid.mermaidAPI.defaultConfig`), which threw client-side
  # and left every diagram showing as raw code on the deployed site.
  [params.mermaid]
    version = "11.6.0"

[menu]
  [[menu.main]]
    name = "Foundations"
    weight = 10
    url = "/docs/"
  [[menu.main]]
    name = "Agent Memory"
    weight = 20
    url = "/agent-memory/"
  [[menu.main]]
    name = "Context Compression"
    weight = 30
    url = "/context-compression/"
  [[menu.main]]
    name = "GitHub"
    weight = 50
    url = "https://github.com/alextra-lab/llm-course"
