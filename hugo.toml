baseURL = "https://learn.frenchforet.com/"
title = "FrenchForet"

enableRobotsTXT = true
enableGitInfo = true

# Language
contentDir = "content"
defaultContentLanguage = "en"

# Docsy needs these
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "tango"
    lineNos = false
    noClasses = false

[module]
  # Mounts: bring the existing lessons/ folder in as the docs section
  # without moving any files (clone-and-read experience stays intact).
  [[module.imports]]
    path = "github.com/google/docsy"
  [[module.imports]]
    path = "github.com/google/docsy/dependencies"

  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "lessons"
    target = "content/docs"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"

[params]
  copyright = "FrenchForet"
  github_repo = "https://github.com/alextra-lab/llm-course"
  github_branch = "main"

  [params.ui]
    breadcrumb_disable = false
    sidebar_menu_compact = false
    sidebar_search_disable = false
    navbar_logo = false

[menu]
  [[menu.main]]
    name = "Lessons"
    weight = 10
    url = "/docs/"
  [[menu.main]]
    name = "GitHub"
    weight = 50
    url = "https://github.com/alextra-lab/llm-course"
